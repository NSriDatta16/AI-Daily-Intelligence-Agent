<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Daily Intelligence</title><style>
:root{--bg:#080b12;--panel:#101622;--text:#eef2ff;--muted:#9aa6bd;--line:#202a3b;--accent:#7c9cff;--hot:#ffb86b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#1b2748 0,transparent 35%),var(--bg);color:var(--text);font:15px Inter,system-ui,-apple-system,Segoe UI,sans-serif}main{max-width:1180px;margin:auto;padding:34px 22px 70px}.top{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:28px}.eyebrow{color:var(--accent);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:12px}.title{font-size:clamp(34px,6vw,58px);line-height:1;margin:8px 0}.sub{color:var(--muted);max-width:680px}.date{color:var(--muted);white-space:nowrap}.hero{background:linear-gradient(135deg,#151d30,#0d1320);border:1px solid var(--line);border-radius:22px;padding:26px;box-shadow:0 20px 60px #0004}.hero h2{margin:0 0 14px;font-size:25px}.hero p{color:#c8d0df;line-height:1.7}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:21px}.card h3{margin:0 0 10px}.card p{color:var(--muted);line-height:1.6}.stories{margin-top:28px}.story{padding:18px 0;border-bottom:1px solid var(--line)}.story:last-child{border-bottom:0}.story a{color:var(--text);font-size:18px;font-weight:700;text-decoration:none}.meta{color:var(--muted);font-size:12px;margin:7px 0}.error{color:#ff8d8d}.loading{color:var(--muted)}@media(max-width:760px){.top{display:block}.date{margin-top:14px}.grid{grid-template-columns:1fr}}
</style></head><body><main><header class="top"><div><div class="eyebrow">AI Intelligence Agent</div><div class="title">Daily AI Briefing</div><div class="sub">The most important AI developments from the previous 24 hours — filtered, ranked and summarized.</div></div><div id="date" class="date">Loading…</div></header><section id="hero" class="hero"><div class="loading">Generating today's intelligence…</div></section><section id="grid" class="grid"></section><section class="stories"><h2>Top stories</h2><div id="stories" class="loading">Loading stories…</div></section></main><script>
const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function section(text,name){const re=new RegExp('(?:^|\\n)#+\\s*'+name+'\\s*\\n([\\s\\S]*?)(?=\\n#+\\s|$)','i');const m=text.match(re);return m?m[1].trim():''}
function firstStory(text){return text.replace(/\[[^\]]*\]\([^)]*\)/g,'').split(/\n+/).map(x=>x.replace(/^[-*#\d.]+\s*/,'').trim()).filter(x=>x.length>45)[0]||'Your daily AI intelligence briefing is ready.'}
async function load(){try{const r=await fetch('briefing.json?'+Date.now());if(!r.ok)throw Error('No briefing published yet');const d=await r.json();document.getElementById('date').textContent=new Date(d.generated_at).toLocaleString([], {dateStyle:'medium',timeStyle:'short'});const b=d.briefing||'';document.getElementById('hero').innerHTML='<div class="eyebrow">🔥 Executive signal</div><h2>'+esc(firstStory(b))+'</h2><p>'+esc(b.slice(0,900))+'</p>';const cats=['Research','Open Source','Industry','What To Watch'];document.getElementById('grid').innerHTML=cats.map(c=>'<article class="card"><h3>'+esc(c)+'</h3><p>'+esc(section(b,c)||'No major developments in this category today.')+'</p></article>').join('');document.getElementById('stories').innerHTML=(d.articles||[]).map((a,i)=>'<article class="story"><a href="'+esc(a.url)+'" target="_blank" rel="noopener">'+(i+1)+'. '+esc(a.title)+'</a><div class="meta">'+esc(a.source)+' · '+esc(a.category)+' · '+esc(a.published_at)+'</div><p>'+esc(a.summary||'')+'</p></article>').join('')||'<div class="loading">No stories available.</div>'}catch(e){document.getElementById('hero').innerHTML='<div class="error">'+esc(e.message)+'</div>';document.getElementById('stories').textContent='Run the Daily AI Briefing workflow to publish the first briefing.'}}
load();
</script></body></html>
