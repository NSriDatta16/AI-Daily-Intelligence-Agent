name: My Daily AI Updates

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'
      timezone: 'America/Toronto'

permissions:
  contents: write
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Generate briefing and dashboard data
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.6-flash
        run: PYTHONPATH=. python -m app.jobs.publish_site
      - name: Build Pages site
        run: cp web/index.html site/index.html
      - name: Persist dashboard history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/analytics.json data/articles.json data/briefings.json
          git diff --cached --quiet || git commit -m "chore: update intelligence history [skip ci]"
          git push
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
